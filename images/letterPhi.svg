<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="golden" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#bfa45c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Círculo exterior -->
  <circle cx="75" cy="75" r="50" fill="url(#golden)" stroke="#7c653a" stroke-width="4" filter="url(#shadow)"/>

  <!-- Traço vertical (pilar) -->
  <rect x="71" y="30" width="8" height="90" fill="#7c653a" rx="2"/>

  <!-- Letra Φ em sobreposição (opcional) -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="Georgia, serif" font-size="80" fill="#7c653a">Φ</text>
</svg>
