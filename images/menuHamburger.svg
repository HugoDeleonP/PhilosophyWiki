<svg width="150" height="100" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldenEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfa45c" />
      <stop offset="100%" stop-color="#7c653a" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Fundo opcional circular (remete ao Φ) -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#goldenEdge)" stroke-width="2" />

  <!-- Linha 1 -->
  <rect x="16" y="20" width="32" height="5" rx="2" fill="#7c653a" filter="url(#shadow)" />

  <!-- Linha 2 -->
  <rect x="16" y="30" width="32" height="5" rx="2" fill="#7c653a" filter="url(#shadow)" />

  <!-- Linha 3 -->
  <rect x="16" y="40" width="32" height="5" rx="2" fill="#7c653a" filter="url(#shadow)" />
</svg>
